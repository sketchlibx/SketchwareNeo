#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Tue Sep 29 19:24:14 GMT 2026
android.nonTransitiveRClass=false
org.gradle.daemon.idletimeout=10800000
systemProp.user.language=en
systemProp.user.country=US
org.gradle.daemon=true
org.gradle.parallel=true
android.injected.testOnly=false
org.gradle.jvmargs=-Xmx4g -XX\:MaxMetaspaceSize\=1g -Dfile.encoding\=UTF-8 -XX\:+UseParallelGC -Dorg.gradle.warning.mode\=all
android.useAndroidX=true
android.enableJetifier=false
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
