import java.io.FileOutputStream
import java.util.jar.JarEntry
import java.util.jar.JarFile
import java.util.jar.JarOutputStream
import org.gradle.api.tasks.compile.JavaCompile
import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes

def secrets = System.getenv("GOOGLE_SERVICES_JSON")

apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"

def ecjOriginalConfiguration = configurations.create("ecjOriginal") {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

def patchedEcjFile = layout.buildDirectory.file("intermediates/ecj-android/ecj-3.32.0-android.jar")

def prepareAndroidCompatibleEcj = tasks.register("prepareAndroidCompatibleEcj") {
    inputs.property("ecjAndroidCompatibilityTransformVersion", 1)
    inputs.files(ecjOriginalConfiguration)
    inputs.file(layout.projectDirectory.file("src/main/java/pro/sketchware/compiler/AndroidInputStreamCompat.java"))
    outputs.file(patchedEcjFile)

    doLast {
        String helperOwner = "pro/sketchware/compiler/AndroidInputStreamCompat"
        int[] rewrittenCalls = [0] as int[]
        int[] remainingCalls = [0] as int[]

        File helperSource = file("src/main/java/pro/sketchware/compiler/AndroidInputStreamCompat.java")
        if (!helperSource.isFile()) {
            throw new GradleException("AndroidInputStreamCompat.java is required by the ECJ compatibility transform")
        }
        if (ecjOriginalConfiguration.files.size() != 1) {
            throw new GradleException("Expected exactly one original ECJ JAR, found ${ecjOriginalConfiguration.files.size()}")
        }

        File inputJar = ecjOriginalConfiguration.singleFile
        File outputJar = patchedEcjFile.get().asFile
        outputJar.parentFile.mkdirs()

        Closure<Boolean> isUnsupportedInputStreamMethod = { String owner, String methodName, String methodDescriptor ->
            if (!owner.startsWith("java/io/")) return false
            return (methodName == "readAllBytes" && methodDescriptor == "()[B") ||
                    (methodName == "readNBytes" && (methodDescriptor == "(I)[B" || methodDescriptor == "([BII)I")) ||
                    (methodName == "transferTo" && methodDescriptor == "(Ljava/io/OutputStream;)J") ||
                    (methodName == "skipNBytes" && methodDescriptor == "(J)V")
        }
        JarFile source = new JarFile(inputJar)
        JarOutputStream target = new JarOutputStream(new FileOutputStream(outputJar))
        try {
            Enumeration<JarEntry> entries = source.entries()
            while (entries.hasMoreElements()) {
                JarEntry entry = entries.nextElement()
                String entryName = entry.name
                String upperName = entryName.toUpperCase(Locale.ROOT)
                boolean signatureFile = upperName.startsWith("META-INF/") &&
                        (upperName.endsWith(".SF") || upperName.endsWith(".RSA") ||
                         upperName.endsWith(".DSA") || upperName.endsWith(".EC") || upperName.endsWith(".SIG"))
                if (entry.directory || signatureFile) {
                    if (entry.directory) {
                        target.putNextEntry(new JarEntry(entryName))
                        target.closeEntry()
                    }
                    continue
                }

                byte[] content = source.getInputStream(entry).withCloseable { it.bytes }
                if (entryName.endsWith(".class")) {
                    ClassReader reader = new ClassReader(content)
                    ClassWriter writer = new ClassWriter(0)
                    ClassVisitor patcher = new ClassVisitor(Opcodes.ASM9, writer) {
                        @Override
                        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                            MethodVisitor delegate = super.visitMethod(access, name, descriptor, signature, exceptions)
                            return new MethodVisitor(Opcodes.ASM9, delegate) {
                                @Override
                                void visitMethodInsn(int opcode, String owner, String methodName, String methodDescriptor, boolean isInterface) {
                                    String replacementName = null
                                    String replacementDescriptor = null

                                    if (isUnsupportedInputStreamMethod(owner, methodName, methodDescriptor) && opcode == Opcodes.INVOKEVIRTUAL) {
                                        if (methodName == "readAllBytes" && methodDescriptor == "()[B") {
                                            replacementName = "readAllBytes"
                                            replacementDescriptor = "(Ljava/io/InputStream;)[B"
                                        } else if (methodName == "readNBytes" && methodDescriptor == "(I)[B") {
                                            replacementName = "readNBytes"
                                            replacementDescriptor = "(Ljava/io/InputStream;I)[B"
                                        } else if (methodName == "readNBytes" && methodDescriptor == "([BII)I") {
                                            replacementName = "readNBytes"
                                            replacementDescriptor = "(Ljava/io/InputStream;[BII)I"
                                        } else if (methodName == "transferTo" && methodDescriptor == "(Ljava/io/OutputStream;)J") {
                                            replacementName = "transferTo"
                                            replacementDescriptor = "(Ljava/io/InputStream;Ljava/io/OutputStream;)J"
                                        } else if (methodName == "skipNBytes" && methodDescriptor == "(J)V") {
                                            replacementName = "skipNBytes"
                                            replacementDescriptor = "(Ljava/io/InputStream;J)V"
                                        }
                                    } else if (owner == "java/io/InputStream" && opcode == Opcodes.INVOKESTATIC &&
                                            methodName == "nullInputStream" && methodDescriptor == "()Ljava/io/InputStream;") {
                                        replacementName = "nullInputStream"
                                        replacementDescriptor = "()Ljava/io/InputStream;"
                                    }

                                    if (replacementName != null) {
                                        rewrittenCalls[0]++
                                        super.visitMethodInsn(Opcodes.INVOKESTATIC, helperOwner, replacementName,
                                                replacementDescriptor, false)
                                    } else {
                                        super.visitMethodInsn(opcode, owner, methodName, methodDescriptor, isInterface)
                                    }
                                }
                            }
                        }
                    }
                    reader.accept(patcher, 0)
                    content = writer.toByteArray()
                }

                JarEntry patchedEntry = new JarEntry(entryName)
                if (entry.time >= 0) patchedEntry.time = entry.time
                target.putNextEntry(patchedEntry)
                target.write(content)
                target.closeEntry()
            }
        } finally {
            target.close()
            source.close()
        }

        JarFile verificationJar = new JarFile(outputJar)
        try {
            Enumeration<JarEntry> entries = verificationJar.entries()
            while (entries.hasMoreElements()) {
                JarEntry entry = entries.nextElement()
                if (entry.directory || !entry.name.endsWith(".class")) continue
                byte[] content = verificationJar.getInputStream(entry).withCloseable { it.bytes }
                ClassReader reader = new ClassReader(content)
                ClassVisitor verifier = new ClassVisitor(Opcodes.ASM9) {
                    @Override
                    MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                        return new MethodVisitor(Opcodes.ASM9) {
                            @Override
                            void visitMethodInsn(int opcode, String owner, String methodName, String methodDescriptor, boolean isInterface) {
                                if (isUnsupportedInputStreamMethod(owner, methodName, methodDescriptor) ||
                                        (owner == "java/io/InputStream" && methodName == "nullInputStream" &&
                                         methodDescriptor == "()Ljava/io/InputStream;")) {
                                    remainingCalls[0]++
                                }
                            }
                        }
                    }
                }
                reader.accept(verifier, ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
            }
        } finally {
            verificationJar.close()
        }

        if (remainingCalls[0] != 0) {
            outputJar.delete()
            throw new GradleException("ECJ Android compatibility patch incomplete: ${remainingCalls[0]} newer-than-API-26 InputStream call(s) remain")
        }
        if (rewrittenCalls[0] == 0) {
            outputJar.delete()
            throw new GradleException("No unsupported InputStream calls were found in ECJ; verify the resolved ECJ artifact before packaging")
        }

        logger.lifecycle("Prepared Android-compatible ECJ: rewrote ${rewrittenCalls[0]} newer-than-API-26 InputStream call(s); verification passed")
    }
}

tasks.named("preBuild").configure {
    dependsOn(prepareAndroidCompatibleEcj)
}
tasks.withType(JavaCompile).configureEach {
    dependsOn(prepareAndroidCompatibleEcj)
}

android {
    compileSdk = 36

    def gitCommitHash = "git rev-parse HEAD".execute().text.trim()
    def shortCommitHash = "git rev-parse --short HEAD".execute().text.trim()

    defaultConfig {
        applicationId = "pro.sketchware"
        namespace = "pro.sketchware"
        //noinspection ExpiredTargetSdkVersion since we don't target getting Sketchware Neo on Google Play.
        targetSdk = 28
        minSdk = 26
        versionCode = 162
        versionName = "v7.0.2"

        buildConfigField("String", "GIT_HASH", "\"${gitCommitHash}\"")

        buildConfigField("String", "SKETCHUB_API_KEY", "\"${System.getenv("SKETCHUB_API_KEY")}\"")
    }


    // Publish one APK for Android 8.0+ and a smaller compatibility range for Android 13+.
    // Both flavors keep the existing targetSdk to avoid silently changing storage/permission behavior.
    flavorDimensions += "minimumApi"
    productFlavors {
        api26 {
            dimension "minimumApi"
            minSdk = 26
            versionNameSuffix = "-api26"
        }
        api33 {
            dimension "minimumApi"
            minSdk = 26
            versionNameSuffix = "-api33"
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            signingConfig = signingConfigs.debug
        }
    }

    packagingOptions {
        resources.excludes += "license/*"
        resources.excludes += "META-INF/DEPENDENCIES"
        
        // Excludes required by Google API Client to avoid build errors
        resources.excludes += "META-INF/LICENSE"
        resources.excludes += "META-INF/LICENSE.txt"
        resources.excludes += "META-INF/license.txt"
        resources.excludes += "META-INF/NOTICE"
        resources.excludes += "META-INF/NOTICE.txt"
        resources.excludes += "META-INF/notice.txt"
        resources.excludes += "META-INF/INDEX.LIST"
        
        resources.pickFirsts += "api_database/*"
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    androidResources {
        additionalParameters.addAll("--stable-ids", "${rootDir}/public-stable-ids.txt")
    }

    signingConfigs {
        debug {
            storeFile = file("../testkey.keystore")
            storePassword = "testkey"
            keyAlias = "testkey"
            keyPassword = "testkey"
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        aidl = false
    }

    configurations.implementation {
        exclude group: 'javax.inject', module: 'javax.inject'
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-compiler-embeddable"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-common"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-scripting-jvm"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-script-runtime"
    }
}

configurations.configureEach { configuration ->
    configuration.resolutionStrategy.force("org.eclipse.jdt:ecj:3.32.0")
    if (configuration.name != ecjOriginalConfiguration.name) {
        configuration.exclude group: "org.eclipse.jdt", module: "ecj"
    }
}

dependencies {
    add(ecjOriginalConfiguration.name, libs.ecj)
    implementation files(patchedEcjFile).builtBy(prepareAndroidCompatibleEcj)
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])

    implementation libs.bundles.ui

    implementation libs.bundles.image

    implementation platform(libs.sora.editor)
    implementation libs.bundles.editor.and.lang

    implementation libs.bundles.coil

    implementation libs.bundles.bundletool
    implementation(libs.sdklib) {
        exclude group: "com.intellij", module: "annotations"
    }

    implementation libs.bundles.shrinker
    implementation libs.zipalign.java

    implementation libs.gson
    implementation libs.scpkix.jdk15on

    implementation libs.markwon

    implementation libs.bundles.networking

    implementation libs.stax.api

    implementation libs.bundles.kotlin.compiler
    compileOnly libs.kotlin.compiler

    implementation libs.dependencyresolver
    implementation libs.filepicker

    implementation libs.libsu
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
    implementation libs.insetter

    implementation(libs.javaparser.symbol.solver) {
        exclude group: "com.google.guava", module: "guava"
    }

    implementation platform(libs.firebase.bom)
    implementation libs.bundles.firebase
    
    implementation libs.bundles.googleDrive

    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.5.0.202303070854-r'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.21"

    implementation 'com.github.termux.termux-app:terminal-view:v0.118.0'
    implementation 'com.github.termux.termux-app:terminal-emulator:v0.118.0'

    coreLibraryDesugaring libs.desugar.jdk.libs.nio
}

